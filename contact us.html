<!DOCTYPE html>

<html>

<head>

  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Contact Us - iOS Online Shopping</title>

  <style>

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background-color: #f5f5f5;

    }

    .nav {

      background-color: white;

      display: flex;

      justify-content: space-between;

      align-items: center;

      padding: 10px 30px;

      box-shadow: 0 4px 8px gray;

    }

    .logo img {

      width: 90px;

    }

    .menu {

      display: flex;

      list-style: none;

      gap: 20px;

    }

    .menu li a {

      color: black;

      text-decoration: none;

    }

    .menu li a:hover {

      color: green;

    }

    .contact {

      width: 600px;

      margin: 60px auto;

      background-color: white;

      padding: 30px;

      border-radius: 10px;

      box-shadow: 0 4px 10px gray;

    }

    .contact h1 {

      text-align: center;

      color: #333;

    }

    .contact p {

      text-align: center;

      color: #666;

    }

    .info {

      margin: 25px 0;

      line-height: 1.8;

    }

    label {

      display: block;

      margin-top: 15px;

      font-weight: bold;

    }

    input, textarea {

      width: 100%;

      padding: 10px;

      margin-top: 5px;

      border: 1px solid #ccc;

      border-radius: 5px;

      box-sizing: border-box;

    }

    textarea {

      height: 120px;

    }

    button {

      display: block;

      margin: 20px auto 0;

      padding: 10px 30px;

      background-color: green;

      color: white;

      border: none;

      border-radius: 5px;

      cursor: pointer;

    }

    button:hover {

      background-color: darkgreen;

    }

    .footer {

      background-color: silver;

      text-align: center;

      padding: 20px;

    }

  </style>

</head>

<body>

  <div class="nav">

    <div class="logo">

      <img src="ios.png">

    </div>

    <ul class="menu">

      <li><a href="IOS Store.html">Home</a></li>

      <li><a href="about.html">About Us</a></li>

      <li><a href="contact.html">Contact Us</a></li>

      <li><a href="faq.html">FAQ</a></li>

    </ul>

  </div>

  <div class="contact">

    <h1>Contact Us</h1>

    <p>

      If you have any questions, please contact us.

    </p>

    <div class="info">

      <strong>Email:</strong> istore@EiAwk.com<br>

      <strong>Phone:</strong> 09-123456789<br>

      <strong>Address:</strong> Yangon, Myanmar<br>

      <strong>Opening Hours:</strong> Monday - Saturday, 9:00 AM - 6:00 PM

    </div>

    <form>

      <label>Name</label>

      <input type="text" placeholder="Enter your name">

      <label>Email</label>

      <input type="email" placeholder="Enter your email">

      <label>Message</label>

      <textarea placeholder="Write your message"></textarea>

      <button type="submit">Send Message</button>

    </form>

  </div>

  <div class="footer">

    We would like to hear what you think!<br>

    Thank you for visiting our website.

  </div>

</body>

</html>
